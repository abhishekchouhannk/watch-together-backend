<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Room — Watch Together</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/room.css" />
  </head>
  <body>
    <div id="roomPage" data-theme="morning">
      <div class="sky-bg" id="skyBg"></div>
      <!-- ===== HEADER ===== -->
      <header class="room-header">
        <button class="back-btn" id="backBtn">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="19" y1="12" x2="5" y2="12" />
            <polyline points="12 19 5 12 12 5" />
          </svg>
          <span class="back-label">Dashboard</span>
        </button>
        <div class="rh-center">
          <span class="rh-name" id="hdrName">Loading…</span>
          <span
            class="mode-badge badge-casual"
            id="hdrBadge"
            style="display: none"
          ></span>
          <span
            class="status-dot status-active"
            id="hdrDot"
            style="display: none"
          ></span>
        </div>
        <div class="rh-right">
          <button
            class="icon-btn"
            id="configBtn"
            type="button"
            title="Room settings"
            aria-label="Room settings"
          >
            <svg
              width="17"
              height="17"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="3" />
              <path
                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6 1.65 1.65 0 0 0 10 3.09V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.14.36.38.68.69.9"
              />
            </svg>
            <span class="gear-badge" id="gearBadge">0</span>
          </button>
          <div class="theme-switcher" id="themeSwitcher">
            <button
              class="theme-btn"
              id="themeBtn"
              type="button"
              aria-haspopup="true"
              aria-expanded="false"
              title="Change theme"
            >
              <span class="theme-btn-icon" id="themeBtnIcon">🌤️</span>
            </button>
            <div class="theme-menu" id="themeMenu" role="menu">
              <button class="theme-opt" data-theme="auto" role="menuitem">
                <span class="theme-opt-swatch sw-auto"></span>
                <span class="theme-opt-icon">🧭</span>
                <span class="theme-opt-label">Auto</span>
                <span class="theme-opt-sub">Matches time of day</span>
              </button>
              <div class="theme-menu-sep"></div>
              <button class="theme-opt" data-theme="morning" role="menuitem">
                <span class="theme-opt-swatch sw-morning"></span>
                <span class="theme-opt-icon">🌅</span>
                <span class="theme-opt-label">Morning</span>
              </button>
              <button class="theme-opt" data-theme="afternoon" role="menuitem">
                <span class="theme-opt-swatch sw-afternoon"></span>
                <span class="theme-opt-icon">☀️</span>
                <span class="theme-opt-label">Afternoon</span>
              </button>
              <button class="theme-opt" data-theme="evening" role="menuitem">
                <span class="theme-opt-swatch sw-evening"></span>
                <span class="theme-opt-icon">🌆</span>
                <span class="theme-opt-label">Evening</span>
              </button>
              <button class="theme-opt" data-theme="night" role="menuitem">
                <span class="theme-opt-swatch sw-night"></span>
                <span class="theme-opt-icon">🌙</span>
                <span class="theme-opt-label">Night</span>
              </button>
            </div>
          </div>
          <button class="leave-btn" id="leaveBtn">
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <polyline points="16 17 21 12 16 7" />
              <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
            <span class="leave-label">Leave</span>
          </button>
        </div>
      </header>
      <!-- ===== ROOM DETAILS ===== -->
      <section class="room-details" id="roomDetails">
        <div style="display: flex; flex-direction: column; gap: 0.55rem">
          <div class="sk" style="width: 55%; height: 1.15rem"></div>
          <div class="sk" style="width: 90%; height: 0.85rem"></div>
          <div class="sk" style="width: 40%; height: 0.85rem"></div>
        </div>
      </section>
      <!-- ===== MAIN CONTENT ===== -->
      <div class="room-content">
        <!-- VIDEO -->
        <div class="video-section">
          <div class="video-container" id="videoContainer">
            <div id="videoWrapper">
              <div class="video-placeholder" id="videoPlaceholder">
                <div class="vp-icon">📺</div>
                <p class="vp-text">No video loaded</p>
                <p class="vp-sub">Paste a URL below to start watching</p>
              </div>
            </div>

            <!-- Click-shield before #fxLayer -->
            <div class="player-shield" id="playerShield"></div>

            <!-- ===== YT VIDEO INFO (thumb / title / author) ===== -->
            <div class="vi-bar" id="viBar" style="display:none" aria-hidden="true">
              <img class="vi-thumb" id="viThumb" alt="" />
              <div class="vi-av" id="viAv" style="display:none"></div>
              <div class="vi-meta">
                <div class="vi-title" id="viTitle"></div>
                <div class="vi-author" id="viAuthor"></div>
              </div>
            </div>

            <!-- ===== SETTINGS MENU ===== -->
            <div class="vc-menu" id="vcMenu" role="menu" aria-label="Player settings"></div>

            <!-- ===== LIVE REACTIONS FLOAT LAYER ===== -->
            <div class="fx-layer" id="fxLayer" aria-hidden="true"></div>

            <!-- ===== REACTION RAIL — right border, vertically centred ===== -->
            <div class="react-rail" id="reactRail">
              <div class="react-hub" id="reactHub">
                <button
                  class="react-toggle"
                  id="reactToggle"
                  type="button"
                  aria-haspopup="true"
                  aria-expanded="false"
                  aria-label="Send a reaction"
                >
                  😀
                </button>
                <div
                  class="react-strip"
                  id="reactStrip"
                  role="group"
                  aria-label="Reactions"
                >
                  <button
                    class="react-btn"
                    type="button"
                    data-emoji="❤️"
                    title="Love (1)"
                  >
                    ❤️
                  </button>
                  <button
                    class="react-btn"
                    type="button"
                    data-emoji="😂"
                    title="Funny (2)"
                  >
                    😂
                  </button>
                  <button
                    class="react-btn"
                    type="button"
                    data-emoji="😮"
                    title="Wow (3)"
                  >
                    😮
                  </button>
                  <button
                    class="react-btn"
                    type="button"
                    data-emoji="😢"
                    title="Sad (4)"
                  >
                    😢
                  </button>
                  <button
                    class="react-btn"
                    type="button"
                    data-emoji="🔥"
                    title="Fire (5)"
                  >
                    🔥
                  </button>
                  <button
                    class="react-btn"
                    type="button"
                    data-emoji="👏"
                    title="Clap (6)"
                  >
                    👏
                  </button>
                  <button
                    class="react-btn"
                    type="button"
                    data-emoji="💀"
                    title="Dead (7)"
                  >
                    💀
                  </button>
                </div>
              </div>
            </div>

            <!-- ===== UP NEXT CARD (T-10s) ===== -->
            <div class="upnext" id="upNext" hidden aria-live="polite">
              <button class="un-x" id="unCancel" type="button" aria-label="Cancel">✕</button>
              <div class="un-label">Up next in <span id="unCount">10</span></div>
              <div class="un-row">
                <div class="un-thumb-wrap">
                  <img class="un-thumb" id="unThumb" alt="" />
                  <div class="un-ring" id="unRing"></div>
                </div>
                <div class="un-meta">
                  <div class="un-title" id="unTitle"></div>
                  <div class="un-sub" id="unSub"></div>
                </div>
              </div>
              <div class="un-btns">
                <button class="un-btn" id="unCancelBtn" type="button">Cancel</button>
                <button class="un-btn un-btn-primary" id="unNowBtn" type="button">Play now ▶</button>
              </div>
            </div>

            <!-- custom controls (hidden until a direct video loads) -->
            <div class="vc" id="videoControls">
              <button class="vc-btn" id="prevBtn" title="Previous video" disabled>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                  <polygon points="19 20 9 12 19 4 19 20" /><rect x="4" y="4" width="2.5" height="16" />
                </svg>
              </button>
              <button class="vc-btn" id="playBtn" title="Play / Pause">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                  <polygon points="6 3 20 12 6 21 6 3" />
                </svg>
              </button>
              <button class="vc-btn" id="nextBtn" title="Next video" disabled>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                  <polygon points="5 4 15 12 5 20 5 4" /><rect x="17.5" y="4" width="2.5" height="16" />
                </svg>
              </button>
              <!-- Lock chip -->
              <button
                class="vc-lock"
                id="vcLock"
                type="button"
                style="display: none"
                title="Playback is host-controlled"
                aria-label="Playback is host-controlled"
              >
                <svg
                  width="12"
                  height="12"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <rect x="3" y="11" width="18" height="11" rx="2" />
                  <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                </svg>
                <span>Host controls</span>
              </button>
              <span class="vc-time" id="curTime">0:00</span>
              <input
                type="range"
                class="vc-range vc-progress"
                id="progressBar"
                min="0"
                max="1000"
                value="0"
                step="1"
              />
              <span class="vc-time" id="durTime">0:00</span>
              <div
                class="vol-wrap"
              >
                <button class="vc-btn" id="muteBtn" title="Mute">
                  <svg
                    id="volIcon"
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
                    <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
                  </svg>
                </button>
                <input
                  type="range"
                  class="vc-range vc-volume"
                  id="volBar"
                  min="0"
                  max="100"
                  value="100"
                  step="1"
                />
              </div>
              <button class="vc-btn" id="settingsBtn" title="Settings" style="display:none"
                  aria-haspopup="true" aria-expanded="false">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="3"/>
                  <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6 1.65 1.65 0 0 0 10 3.09V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.14.36.38.68.69.9"/>
                </svg>
              </button>
              <button class="vc-btn" id="fsBtn" title="Fullscreen">
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <polyline points="15 3 21 3 21 9" />
                  <polyline points="9 21 3 21 3 15" />
                  <line x1="21" y1="3" x2="14" y2="10" />
                  <line x1="3" y1="21" x2="10" y2="14" />
                </svg>
              </button>
            </div>
          </div>
          <div class="player-bar" id="playerBar">
            <div class="url-bar">
              <input type="text" class="url-input" id="urlInput"
                    placeholder="Paste video URL (.mp4, YouTube, etc.)" autocomplete="off" />
              <button class="btn-sm" id="loadUrlBtn">Load</button>
              <button class="btn-sm btn-ghost" id="queueUrlBtn" title="Add to queue">+ Queue</button>
            </div>
          </div>
        </div>
        <!-- SIDE PANEL (Chat + Queue) -->
        <div class="chat-section" id="chatSection">
          <!-- tabs replace the old .chat-head -->
          <div class="sp-tabs" role="tablist">
            <button class="sp-tab active" id="tabChat" data-tab="chat" role="tab" aria-selected="true">
              💬 Chat
            </button>
            <button class="sp-tab" id="tabQueue" data-tab="queue" role="tab" aria-selected="false">
              📺 Queue <span class="sp-badge" id="queueCount">0</span>
            </button>
            <span class="sp-online" id="chatOnline"></span>
          </div>
          <div class="sp-panes">
            <!-- ── CHAT ── -->
            <section class="sp-pane active" id="paneChat" role="tabpanel">
              <div class="chat-messages" id="chatMessages"></div>
              <div class="chat-bar">
                <input type="text" class="chat-input" id="chatInput"
                      placeholder="Type a message…" autocomplete="off" maxlength="500" />
                <button class="send-btn" id="sendBtn" title="Send">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                      stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13" />
                    <polygon points="22 2 15 22 11 13 2 9 22 2" />
                  </svg>
                </button>
              </div>
            </section>
            <!-- ── QUEUE ── -->
            <section class="sp-pane" id="paneQueue" role="tabpanel">
              <div class="q-head">
                <span class="q-head-title">Playlist</span>
                <label class="q-auto" title="Automatically play the next video">
                  <input type="checkbox" id="qAutoplay" checked /><span>Autoplay</span>
                </label>
                <button class="q-clear" id="queueClearBtn" type="button">Clear</button>
              </div>
              <ol class="q-list" id="queueList"></ol>
              <div class="q-empty" id="queueEmpty">
                <div class="q-empty-icon">🎬</div>
                <p class="q-empty-t">Queue is empty</p>
                <p class="q-empty-s">Add videos and they'll play back to back</p>
              </div>
              <div class="q-bar" id="queueBar">
                <input type="text" class="url-input" id="queueInput"
                      placeholder="Paste a URL to add to queue…" autocomplete="off" />
                <button class="btn-sm" id="queueAddBtn" type="button">Add</button>
              </div>
              <div class="q-lock" id="queueLock" hidden>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="11" width="18" height="11" rx="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" />
                </svg>
                <span>Only the host &amp; moderators can edit the queue</span>
              </div>
            </section>
          </div>
        </div>
      </div>
      <div class="cfg-backdrop" id="cfgBackdrop"></div>
      <aside
        class="cfg-sheet"
        id="cfgSheet"
        role="dialog"
        aria-modal="true"
        aria-hidden="true"
        aria-labelledby="cfgTitle"
      >
        <header class="cfg-head">
          <h3 id="cfgTitle">Room settings</h3>
          <button class="cfg-x" id="cfgClose" type="button" aria-label="Close">
            ✕
          </button>
        </header>
        <div class="cfg-body" id="cfgBody"></div>
      </aside>
      <div class="toast-wrap" id="toastWrap"></div>
    </div>
    <!-- ===== SCRIPTS ===== -->
    <script type="module" src="/js/helpers/timeOfDay.js"></script>
    <script src="/js/room.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <!-- served automatically -->
  </body>
</html>
